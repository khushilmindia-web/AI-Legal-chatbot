<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal AI Auth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <main class="auth-shell">
        <section class="auth-hero">
            <span class="auth-kicker">AI Legal India</span>
            <h1>Sign in to your legal assistant workspace</h1>
            <p>Store your account, profile, and chat history in one place, then continue your legal guidance flow securely.</p>
        </section>

        <section class="auth-card">
            <div class="auth-tabs">
                <button id="loginTab" class="auth-tab active" type="button">Login</button>
                <button id="signupTab" class="auth-tab" type="button">Sign Up</button>
            </div>

            <form id="loginForm" class="auth-form" method="post">
                <label>Email</label>
                <input id="loginEmail" type="email" placeholder="you@example.com" required>
                <label>Password</label>
                <input id="loginPassword" type="password" placeholder="Enter your password" required>
                <button type="submit">Login</button>
            
            <button id="googleLoginBtn" class="auth-tab google-btn" type="button">Continue with Google</button>
                            <a href="#" id="forgotPasswordLink" class="forgot-password-link">Forgot Password?</a>
                            </form>


            <form id="signupForm" class="auth-form hidden" method="post">
                <label>Full Name</label>
                <input id="signupName" type="text" placeholder="Your full name" required>
                <label>Email</label>
                <input id="signupEmail" type="email" placeholder="you@example.com" required>
                <label>Password</label>
                <input id="signupPassword" type="password" placeholder="At least 8 characters" required>
                <label>State / UT</label>
                <select id="signupState">
                    <option value="">Select State / UT</option>
                </select>
                <button type="submit">Create Account</button>
            </form>

            <div id="authMessage" class="auth-message"></div>
        </section>

        <!-- Password Reset Modal -->
        <div id="passwordResetModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Reset Password</h2>
                <form id="passwordResetForm" class="auth-form">
                    <label>Email</label>
                    <input id="resetEmail" type="email" placeholder="Enter your email" required>
                    <button type="submit">Send Reset Link</button>
                </form>
                <div id="resetMessage" class="auth-message"></div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
